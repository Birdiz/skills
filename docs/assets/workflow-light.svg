<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" width="960" height="572" role="img" aria-label="Audit workflow: frame, audit, deliver">
<title>Audit workflow: frame, audit, deliver</title>
<style>
svg { --ink:#1B1F3B; --muted:#5D6480; --line:#CDD2E1; --card:#FFFFFF; --surface:#F4F5FA; --accent:#E8772E; --accent-soft:#FDEBDD; --ok:#2E9E6B; --bad:#D64545; --idle:#8A90A6; --solid:#1B1F3B; --on-solid:#FFFFFF; }
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill:var(--ink); } .muted { fill:var(--muted); } .accent { fill:var(--accent); }
.on-solid { fill:var(--on-solid); }
.card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
.solid { fill:var(--solid); }
.surface { fill:var(--surface); stroke:var(--line); stroke-width:1.5; }
.chip { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
.wire { fill:none; stroke:var(--muted); stroke-width:1.8; }
.loop { fill:none; stroke:var(--accent); stroke-width:1.8; stroke-dasharray:6 5; }
.head { fill:var(--muted); } .head-accent { fill:var(--accent); }
</style>
<text class="mono accent" x="28" y="68" font-size="13" font-weight="700">01</text><text class="mono muted" x="28" y="86" font-size="12" letter-spacing="1.5">FRAME</text>
<text class="mono accent" x="28" y="230" font-size="13" font-weight="700">02</text><text class="mono muted" x="28" y="248" font-size="12" letter-spacing="1.5">AUDIT</text>
<text class="mono accent" x="28" y="418" font-size="13" font-weight="700">03</text><text class="mono muted" x="28" y="436" font-size="12" letter-spacing="1.5">DELIVER</text>
<rect class="solid" x="150" y="34" width="236" height="68" rx="12"/><text class="mono on-solid" x="168" y="64" font-size="15" font-weight="700">/audit-setup</text><text class="on-solid" x="168" y="86" font-size="12.5" opacity="0.78">auditor profile · once per machine</text>
<rect class="solid" x="426" y="34" width="236" height="68" rx="12"/><text class="mono on-solid" x="444" y="64" font-size="15" font-weight="700">/audit-kickoff</text><text class="on-solid" x="444" y="86" font-size="12.5" opacity="0.78">engagement · once per audit</text>
<rect class="card" x="702" y="34" width="236" height="68" rx="12"/><text class="mono ink" x="720" y="64" font-size="15" font-weight="700">recon</text><text class="muted" x="720" y="86" font-size="12.5">one shared codebase map</text>
<path class="wire" d="M386 68.0 L418 68.0"/><polygon class="head" points="426,68.0 417,63.0 417,73.0"/>
<path class="wire" d="M662 68.0 L694 68.0"/><polygon class="head" points="702,68.0 693,63.0 693,73.0"/>
<rect class="surface" x="440" y="150" width="498" height="150" rx="14"/>
<text class="ink" x="458" y="178" font-size="14" font-weight="600">8 axes</text><text class="muted" x="516" y="178" font-size="12.5">one findings file each, in a common format</text>
<rect class="chip" x="458.0" y="194" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="512.8" y="212" font-size="12" text-anchor="middle">app-security</text>
<rect class="chip" x="575.5" y="194" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="630.2" y="212" font-size="12" text-anchor="middle">infra-security</text>
<rect class="chip" x="693.0" y="194" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="747.8" y="212" font-size="12" text-anchor="middle">privacy</text>
<rect class="chip" x="810.5" y="194" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="865.2" y="212" font-size="12" text-anchor="middle">code-quality</text>
<rect class="chip" x="458.0" y="230" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="512.8" y="248" font-size="12" text-anchor="middle">architecture</text>
<rect class="chip" x="575.5" y="230" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="630.2" y="248" font-size="12" text-anchor="middle">accessibility</text>
<rect class="chip" x="693.0" y="230" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="747.8" y="248" font-size="12" text-anchor="middle">seo</text>
<rect class="chip" x="810.5" y="230" width="109.5" height="27" rx="13.5"/><text class="mono ink" x="865.2" y="248" font-size="12" text-anchor="middle">performance</text>
<text class="muted" x="458" y="284" font-size="12.5">findings · leads · questions only the owner can answer</text>
<path class="wire" d="M820.0 102 L820.0 142"/><polygon class="head" points="820.0,150 815.0,141 825.0,141"/>
<rect class="card" x="150" y="172" width="254" height="106" rx="12"/><text class="mono ink" x="168" y="202" font-size="15" font-weight="700">verify-findings</text><text class="muted" x="168" y="224" font-size="12.5">try to refute, from another context</text>
<circle cx="173" cy="251" r="5" fill="var(--ok)"/><text class="muted" x="183" y="255.5" font-size="11.5">confirmed</text>
<circle cx="254.0" cy="251" r="5" fill="var(--bad)"/><text class="muted" x="264.0" y="255.5" font-size="11.5">refuted</text>
<circle cx="323.0" cy="251" r="5" fill="var(--idle)"/><text class="muted" x="333.0" y="255.5" font-size="11.5">unverified</text>
<path class="wire" d="M440 212 L412 212"/><polygon class="head" points="404,212 413,207 413,217"/>
<path class="loop" d="M354 278 L354 330 L689.0 330 L689.0 309"/><polygon class="head-accent" points="689.0,300 684.0,309 694.0,309"/>
<rect x="365.5" y="316" width="312" height="28" rx="14" fill="var(--card)" stroke="var(--accent)" stroke-width="1.5"/><text class="ink" x="521.5" y="334.5" font-size="12.5" text-anchor="middle">owner’s answers → lead pass → verified again</text>
<path class="wire" d="M210 278 L210 376"/><polygon class="head" points="210,384 205,375 215,375"/>
<rect class="card" x="150" y="384" width="236" height="68" rx="12"/><text class="mono ink" x="168" y="414" font-size="15" font-weight="700">remediation-plan</text><text class="muted" x="168" y="436" font-size="12.5">findings grouped into ordered fixes</text>
<rect class="card" x="426" y="384" width="236" height="68" rx="12"/><text class="mono ink" x="444" y="414" font-size="15" font-weight="700">audit-report</text><text class="muted" x="444" y="436" font-size="12.5">peer report · summary · prompts</text>
<rect class="card" x="702" y="384" width="236" height="68" rx="12"/><text class="mono ink" x="720" y="414" font-size="15" font-weight="700">tickets</text><text class="muted" x="720" y="436" font-size="12.5">one per fix · tracker or local files</text>
<path class="wire" d="M386 418.0 L418 418.0"/><polygon class="head" points="426,418.0 417,413.0 417,423.0"/>
<path class="wire" d="M662 418.0 L694 418.0"/><polygon class="head" points="702,418.0 693,413.0 693,423.0"/>
<rect x="150" y="482" width="788" height="36" rx="10" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="168" y="505" font-size="12.5"><tspan class="mono ink" font-weight="700">finding-format</tspan><tspan class="muted" dx="10">the schema, rules of engagement and validator every step writes to</tspan></text>
<rect class="solid" x="150" y="538" width="18" height="14" rx="4"/><text class="muted" x="176" y="550" font-size="12">you run it</text><rect class="card" x="260" y="538" width="18" height="14" rx="4"/><text class="muted" x="286" y="550" font-size="12">the agent runs it</text><line x1="412" y1="545" x2="442" y2="545" class="loop"/><text class="muted" x="450" y="550" font-size="12">only touches what the answers concern</text>
</svg>
