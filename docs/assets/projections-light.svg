<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-label="One set of findings, several reports">
<title>One set of findings, several reports</title>
<style>
svg { --ink:#1B1F3B; --muted:#5D6480; --line:#CDD2E1; --card:#FFFFFF; --surface:#F4F5FA; --accent:#E8772E; --accent-soft:#FDEBDD; --ok:#2E9E6B; --bad:#D64545; --idle:#8A90A6; --solid:#1B1F3B; --on-solid:#FFFFFF; }
text { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.ink { fill:var(--ink); } .muted { fill:var(--muted); } .accent { fill:var(--accent); }
.on-solid { fill:var(--on-solid); }
.card { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
.solid { fill:var(--solid); }
.surface { fill:var(--surface); stroke:var(--line); stroke-width:1.5; }
.chip { fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.2; }
.wire { fill:none; stroke:var(--muted); stroke-width:1.8; }
.loop { fill:none; stroke:var(--accent); stroke-width:1.8; stroke-dasharray:6 5; }
.head { fill:var(--muted); } .head-accent { fill:var(--accent); }
</style>
<rect class="card" x="58" y="52" width="190" height="132" rx="10"/>
<rect class="card" x="49" y="61" width="190" height="132" rx="10"/>
<rect class="card" x="40" y="70" width="190" height="132" rx="10"/>
<text class="mono ink" x="58" y="104" font-size="14" font-weight="700">findings/*.md</text>
<line x1="58" y1="128" x2="178" y2="128" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
<line x1="58" y1="144" x2="208" y2="144" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" opacity="1"/>
<line x1="58" y1="160" x2="158" y2="160" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
<line x1="58" y1="176" x2="190" y2="176" stroke="var(--muted)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
<text class="muted" x="40" y="234" font-size="12.5">one set, verified</text>
<path class="wire" d="M230 136 C320 136 320 59.0 461 59.0"/><polygon class="head" points="470,59.0 461,54.0 461,64.0"/>
<rect class="card" x="470" y="24" width="450" height="70" rx="12"/><rect x="470" y="38" width="4" height="42" rx="2" fill="var(--accent)"/><text class="ink" x="492" y="53" font-size="15" font-weight="700">peer report</text><text class="muted" x="492" y="75" font-size="12.5">technical reader · confidential</text><text class="muted" x="902" y="53" font-size="12.5" text-anchor="end">everything, sensitive included</text>
<path class="wire" d="M230 136 C320 136 320 145.0 461 145.0"/><polygon class="head" points="470,145.0 461,140.0 461,150.0"/>
<rect class="card" x="470" y="110" width="450" height="70" rx="12"/><rect x="470" y="124" width="4" height="42" rx="2" fill="var(--accent)"/><text class="ink" x="492" y="139" font-size="15" font-weight="700">summary</text><text class="muted" x="492" y="161" font-size="12.5">decision maker · plain language</text><text class="muted" x="902" y="139" font-size="12.5" text-anchor="end">confirmed only, quick wins first</text>
<path class="wire" d="M230 136 C320 136 320 231.0 461 231.0"/><polygon class="head" points="470,231.0 461,226.0 461,236.0"/>
<rect class="card" x="470" y="196" width="450" height="70" rx="12"/><rect x="470" y="210" width="4" height="42" rx="2" fill="var(--accent)"/><text class="ink" x="492" y="225" font-size="15" font-weight="700">remediation prompts</text><text class="muted" x="492" y="247" font-size="12.5">coding agent or developer</text><text class="muted" x="902" y="225" font-size="12.5" text-anchor="end">the target state, never the attack</text>
<text class="muted" x="470" y="300" font-size="12.5">A projection adds no analysis: regenerated, never edited, when the findings change.</text>
</svg>
